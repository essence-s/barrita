[package]
name = "barrita"
version = "0.1.0"
edition = "2024"

[dependencies]
slint = { version = "1.16.1", default-features = false, features = [
  "std",
  "renderer-skia"
] }
spell-framework = "1.0.5"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["gif", "png", "jpeg"] }
# tray-icon = "0.22"  # TODO: activar cuando implementemos tray en Wayland
toml = "0.8"
dirs = "5"

[build-dependencies]
slint-build = "1.16"