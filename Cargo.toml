[package]
name = "barrita"
version = "0.1.0"
edition = "2024"

[dependencies]
slint = { version = "1.16.1", features = [
  "backend-winit",
  "renderer-femtovg",
  "renderer-skia",
  "raw-window-handle-06"
] }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
thiserror = "2"
winit = "0.30"
image = { version = "0.25", default-features = false, features = ["gif", "png", "jpeg"] }
# tray-icon = "0.22"  # TODO: activar cuando implementemos tray en Wayland
toml = "0.8"
dirs = "5"
[target.'cfg(target_os = "linux")'.dependencies]
mpris = "2.0"
zbus = "4"

[build-dependencies]
slint-build = "1.16"