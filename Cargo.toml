[package]
name = "barrita"
version = "0.1.0"
edition = "2024"

[dependencies]
slint = { version = "1.17.0", default-features = false, features = [
  "std",
  "renderer-skia"
] }
spell-framework = "1.0.5"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
thiserror = "2"
mpris = "2.1"
image = { version = "0.25", default-features = false, features = ["gif", "png", "jpeg"] }
# tray-icon = "0.22"  # TODO: activar cuando implementemos tray en Wayland
toml = "0.8"
dirs = "5"
hyprland = { version = "0.4.0-beta.3", default-features = false, features = ["listener"] }
dbus = "0.9"
system-tray = "0.8"
tokio = { version = "1", features = ["rt", "macros", "sync"] }

[build-dependencies]
slint-build = "1.17"
